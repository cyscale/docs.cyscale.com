<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Security score gauge examples</title>
  <desc id="desc">Security score gauge examples for scores of 100, 90, 75, 50, and 25, with risk bands and an example calculation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef3fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1f3b68" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="18" fill="url(#bg)"/>
  <rect x="32" y="28" width="1136" height="664" rx="16" fill="#fff" filter="url(#shadow)"/>
  <text x="72" y="82" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#173b8f">Security score</text>
  <text x="72" y="112" font-family="Arial, sans-serif" font-size="16" fill="#667085">The gauge moves down as failed controls and impacted assets increase risk.</text>

  <g transform="translate(72 150)">
    <rect width="1056" height="300" rx="12" fill="#f8fafc" stroke="#e5eaf2"/>
    <text x="28" y="42" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1d2939">Example asset</text>
    <text x="28" y="70" font-family="Arial, sans-serif" font-size="14" fill="#667085">Two high-severity failures · 2 impacted assets</text>
    <g transform="translate(44 94)">
      <path d="M0 132 A132 132 0 0 1 264 132" fill="none" stroke="#e8ecf2" stroke-width="28" stroke-linecap="round"/>
      <path d="M0 132 A132 132 0 0 1 66 17" fill="none" stroke="#e33b73" stroke-width="28" stroke-linecap="round"/>
      <text x="132" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#1d2939">25%</text>
      <text x="132" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#667085">High risk</text>
      <text x="0" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#667085">0</text>
      <text x="264" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#667085">100</text>
    </g>
    <g transform="translate(390 108)">
      <rect width="610" height="54" rx="8" fill="#fff" stroke="#e5eaf2"/>
      <circle cx="28" cy="27" r="7" fill="#e33b73"/>
      <text x="48" y="33" font-family="Arial, sans-serif" font-size="15" fill="#344054">High severity failure</text>
      <text x="570" y="33" text-anchor="end" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1d2939">−50%</text>
      <rect y="68" width="610" height="54" rx="8" fill="#fff" stroke="#e5eaf2"/>
      <circle cx="28" cy="95" r="7" fill="#e33b73"/>
      <text x="48" y="101" font-family="Arial, sans-serif" font-size="15" fill="#344054">One additional high-severity failure</text>
      <text x="570" y="101" text-anchor="end" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1d2939">×0.5</text>
      <rect y="136" width="610" height="54" rx="8" fill="#fff" stroke="#e5eaf2"/>
      <circle cx="28" cy="163" r="7" fill="#f08a3c"/>
      <text x="48" y="169" font-family="Arial, sans-serif" font-size="15" fill="#344054">Two impacted assets</text>
      <text x="570" y="169" text-anchor="end" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1d2939">×0.5²</text>
    </g>
  </g>

  <text x="72" y="496" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1d2939">Gauge bands</text>
  <g transform="translate(72 520)">
    <rect width="196" height="92" rx="10" fill="#eaf8f0"/><text x="98" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#16834a">100%</text><text x="98" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#344054">Minimal risk</text>
    <rect x="214" width="196" height="92" rx="10" fill="#f5f8df"/><text x="312" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#71820c">76–99%</text><text x="312" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#344054">Low risk</text>
    <rect x="428" width="196" height="92" rx="10" fill="#fff4dc"/><text x="526" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#bd7100">51–75%</text><text x="526" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#344054">Medium risk</text>
    <rect x="642" width="196" height="92" rx="10" fill="#fde9ef"/><text x="740" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#c21f5b">0–50%</text><text x="740" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#344054">High risk</text>
    <rect x="856" width="200" height="92" rx="10" fill="#f8fafc" stroke="#e5eaf2"/><text x="956" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#344054">100 → 25%</text><text x="956" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#667085">risk increases</text>
  </g>
</svg>
